[project]
name = "meshtastic-mqtt-sniffer"
version = "0.1.0"
description = "Capture Meshtastic MQTT packets and save them to SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "paho-mqtt>=2.1",
    "protobuf>=5",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
meshtastic-mqtt-sniffer = "meshtastic_mqtt_sniffer.main:app"
# Development
sync = "protobufs.generate_protobufs:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[build-system]
requires = [
    "grpcio-tools>=1.70",
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/meshtastic_mqtt_sniffer",
    "src/protobufs",
]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
include = [
    "/hatch_build.py",
    "/protobufs",
    "/src",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",
    "COM812",
    "D100",
    "D104",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
